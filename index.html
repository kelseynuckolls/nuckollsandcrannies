function getEventsForMonth(yr, mo) {
  const results = [];
  importantDates.forEach(d => {
    const [ey, em, eday] = d.date.split('-').map(Number);
    if (d.repeat==='yes') {
      if (em === mo+1) results.push({ ...d, displayDate: new Date(yr, mo, eday) });
    } else {
      if (ey===yr && em===mo+1) results.push({ ...d, displayDate: new Date(yr, mo, eday) });
    }
  });
  return results;
}

  const label = new Date(calYear, calMonth).toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('cal-month-label').textContent = label;

  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  const events = getEventsForMonth(calYear, calMonth);

  let html = '';
  for (let i=firstDay-1; i>=0; i--) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${daysInPrev-i}</div></div>`;
  }
  for (let d=1; d<=daysInMonth; d++) {
    const isToday = d===now.getDate() && calMonth===now.getMonth() && calYear===now.getFullYear();
    const dayEvents = events.filter(e=>e.displayDate.getDate()===d);
    const evHtml = dayEvents.map(e=>`<div class="cal-event ${catColors[e.cat]}" title="${e.name}">${catEmoji[e.cat]} ${e.name}</div>`).join('');
    html += `<div class="cal-day${isToday?' today':''}"><div class="cal-day-num">${d}</div>${evHtml}</div>`;
  }
  const total = firstDay + daysInMonth;
  const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
  for (let i=1; i<=remaining; i++) {
    html += `<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  }
  document.getElementById('cal-days').innerHTML = html;
}

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }

function renderList() {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());

  const withNext = importantDates.map(d => {
    const [ey, em, eday] = d.date.split('-').map(Number);
    let next;
    if (d.repeat==='yes') {
      next = new Date(now.getFullYear(), em-1, eday);
      if (next < today) next = new Date(now.getFullYear()+1, em-1, eday);
    } else {
      next = new Date(ey, em-1, eday);
    }
    const diff = Math.round((next-today)/(1000*60*60*24));
    return { ...d, next, diff };
  }).sort((a,b)=>a.diff-b.diff);

  const upcoming = withNext.filter(d=>d.diff>=0);
  const past = withNext.filter(d=>d.diff<0);

  function itemHtml(d) {
    const diffLabel = d.diff===0 ? '🎉 Today!' : d.diff===1 ? 'Tomorrow' : `In ${d.diff} days`;
    const dateLabel = d.next.toLocaleDateString('en-US',{month:'long',day:'numeric',year:'numeric'});
    return `<div class="date-item">
      <div class="date-item-dot" style="background:${catDots[d.cat]}"></div>
      <div class="date-item-info">
        <div class="date-item-name">${catEmoji[d.cat]} ${d.name}</div>
        <div class="date-item-date">${dateLabel}</div>
      </div>
      <div class="date-item-upcoming">${d.diff>=0?diffLabel:''}</div>
      <button class="date-item-delete" onclick="deleteDate(${d.id})" title="Delete">✕</button>
    </div>`;
  }

  let html = '';
  if (upcoming.length) {
    html += `<div class="dates-section-header">Upcoming</div><div class="dates-list">${upcoming.map(itemHtml).join('')}</div>`;
  }
  if (past.length) {
    html += `<div class="dates-section-header" style="margin-top:1.25rem">Past (this year)</div><div class="dates-list">${past.map(itemHtml).join('')}</div>`;
  }
  if (!importantDates.length) html = '<p style="color:var(--text-muted);font-size:0.85rem;">No dates added yet. Click + Add Date to get started.</p>';
  document.getElementById('dates-list-container').innerHTML = html;
}

async function loadCookbookData() {
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/budget_data?id=eq.cookbook_recipes&select=data`, {
      headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
    });
    const rows = await res.json();
    if (rows && rows.length > 0 && rows[0].data) {
      cookbookRecipes = rows[0].data;
    } else {
      cookbookRecipes = SEED_RECIPES.slice();
      saveCookbookData();
    }
  } catch(e) {
    console.warn('Cookbook load failed', e);
    cookbookRecipes = SEED_RECIPES.slice();
  }
  renderCookbook();
}

async function saveCookbookData() {
  try {
    await fetch(`${SUPABASE_URL}/rest/v1/budget_data`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'apikey': SUPABASE_KEY,
        'Authorization': 'Bearer ' + SUPABASE_KEY,
        'Prefer': 'resolution=merge-duplicates'
      },
      body: JSON.stringify({ id: 'cookbook_recipes', data: cookbookRecipes, updated_at: new Date().toISOString() })
    });
  } catch(e) { console.warn('Cookbook save failed', e); }
}

function scaleIngredientText(text, scale) {
  if (scale === 1) return text;
  const fractionMap = {'½':0.5,'⅓':1/3,'⅔':2/3,'¼':0.25,'¾':0.75,'⅛':0.125};
  const match = text.match(/^([\d]+\s+)?([\d.\/]+|[½⅓⅔¼¾⅛])\s?/);
  if (!match) return text;
  const wholePart = match[1] ? parseFloat(match[1].trim()) : 0;
  const fracPart = match[2];
  let qty;
  if (fractionMap[fracPart] !== undefined) qty = wholePart + fractionMap[fracPart];
  else if (fracPart.includes('/')) { const [num,den] = fracPart.split('/').map(Number); qty = wholePart + (num/den); }
  else qty = wholePart + parseFloat(fracPart);
  if (isNaN(qty)) return text;
  const rounded = Math.round(qty * scale * 100) / 100;
  const rest = text.slice(match[0].length);
  return `${Number.isInteger(rounded) ? rounded : rounded.toFixed(2).replace(/\.?0+$/,'')} ${rest}`;
}

function openRecipeDetail(id) {
  const r = cookbookRecipes.find(x => x.id === id);
  if (!r) return;
  cookbookServings[id] = r.servings || 4;
  renderRecipeDetail(r);
  document.getElementById('recipe-detail-modal').classList.add('open');
}

function closeRecipeDetail() { document.getElementById('recipe-detail-modal').classList.remove('open'); }

function renderRecipeDetail(r) {
  const base = r.servings || 4;
  const current = cookbookServings[r.id] || base;
  const scale = current / base;
  const scaledIngs = r.ingredients.map(i => scaleIngredientText(i, scale));

  document.getElementById('recipe-detail-box').innerHTML = `
    <button class="recipe-modal-close" onclick="closeRecipeDetail()">&times;</button>
    <h3>${escHtml(r.title)}</h3>
    <div class="recipe-modal-desc">${escHtml(r.desc)}</div>
    <div class="recipe-serving-row">
      <button onclick="adjustRecipeServings('${r.id}',-1)">−</button>
      <strong>${current}</strong> servings
      <button onclick="adjustRecipeServings('${r.id}',1)">+</button>
    </div>
    <h4>Ingredients</h4>
    <ul>${scaledIngs.map(i => `<li>${escHtml(i)}</li>`).join('')}</ul>
    <h4>Instructions</h4>
    <ol>${r.instructions.map(i => `<li>${escHtml(i)}</li>`).join('')}</ol>
    ${r.notes ? `<div class="recipe-notes-box">${escHtml(r.notes)}</div>` : ''}
    <div class="recipe-modal-footer">
      ${r.custom ? `<button class="recipe-delete-btn" onclick="deleteRecipe('${r.id}')">Remove recipe</button>` : ''}
    </div>
  `;
}

function adjustRecipeServings(id, delta) {
  const r = cookbookRecipes.find(x => x.id === id);
  const base = r.servings || 4;
  cookbookServings[id] = Math.max(1, (cookbookServings[id] || base) + delta);
  renderRecipeDetail(r);
}

function deleteRecipe(id) {
  cookbookRecipes = cookbookRecipes.filter(r => r.id !== id);
  saveCookbookData();
  closeRecipeDetail();
  renderCookbook();
}

function openAddRecipe() {

function closeAddRecipe() {

function saveNewRecipe() {
  const title = document.getElementById('r-title').value.trim();
  const category = document.getElementById('r-category').value.trim() || 'Uncategorized';
  const desc = document.getElementById('r-desc').value.trim() || 'A family favorite.';
  const ingredientsRaw = document.getElementById('r-ingredients').value.trim();
  const instructionsRaw = document.getElementById('r-instructions').value.trim();
  const notes = document.getElementById('r-notes').value.trim();
  const servings = parseInt(document.getElementById('r-servings').value) || 4;

  if (!title || !ingredientsRaw || !instructionsRaw) { alert('Please add a title, ingredients, and instructions.'); return; }

  cookbookRecipes.push({
    id: 'r-' + Date.now(),
    title, category, desc, servings,
    ingredients: ingredientsRaw.split('\n').map(s => s.trim()).filter(Boolean),
    instructions: instructionsRaw.split('\n').map(s => s.trim()).filter(Boolean),
    notes,
    custom: true
  });
  saveCookbookData();
  closeAddRecipe();
  cookbookCategory = category;
  renderCookbook();
}
